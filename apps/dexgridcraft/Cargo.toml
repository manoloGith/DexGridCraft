[package]
name = "dexgridcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "GridCraft's desktop interface on Android (Samsung DeX, desktop windowing): the native library the Android app loads"

[lib]
name = "dexgridcraft"
# cdylib: the library the Android activity loads; lib: the desktop binary and the tests
crate-type = ["cdylib", "lib"]

[[bin]]
# The same interface in a desktop window, to iterate without a device.
name = "dexgridcraft-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
desktop = ["eframe/x11", "eframe/wayland"]

[dependencies]
gridcraft-engine = { path = "../../upstream/crates/engine" }
# GridCraft's desktop interface, from the fork's `dexcraft/android` branch.
gridcraft-ui-egui = { path = "../../upstream/crates/ui-egui" }
egui = { version = "0.37", features = ["default_fonts"] }
# wgpu draws; OpenGL ES (glow) is the fallback.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "accesskit"] }
image = { version = "0.25", default-features = false }
log = "0.4"
serde_json = "1"
# The shared Android layer of the Crafting Apps: input, lifecycle, pickers, clipboard, printing.
craft-android = { path = "../../craft-android/crates/craft-android" }

[target.'cfg(target_os = "android")'.dependencies]
# GameActivity (craft-android's CraftActivity), not NativeActivity: eframe's `accesskit` is only
# available with it.
eframe = { version = "0.37", default-features = false, features = ["android-game-activity"] }
